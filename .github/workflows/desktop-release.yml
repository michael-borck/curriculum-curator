# Shared Electron release pipeline: michael-borck/app-hq/.github/workflows/electron-release.yml
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Pin the shared pipeline to a commit, not a movable branch: it receives
    # Apple signing secrets, so a compromised/rewritten @main must not run.
    uses: michael-borck/app-hq/.github/workflows/electron-release.yml@14770febcfae6408c00d162233443587d6a5b2e7
    env:
      GH_OWNER: michael-borck
    with:
      product-name: Curriculum Curator
      node-version: '22'
      cache: ''
      # Works in bash and PowerShell; the shared workflow's Install step does
      # not force bash on Windows.
      install-command: npm ci --prefix frontend && npm ci --prefix desktop
      # Keep every package version in step with the release tag. Without this,
      # electron-builder names artifacts and latest*.yml after a stale
      # package.json version, which breaks auto-update version comparison.
      setup-command: |
        export VERSION="${GITHUB_REF_NAME#v}"
        (cd frontend && npm version "$VERSION" --no-git-tag-version --allow-same-version)
        (cd desktop && npm version "$VERSION" --no-git-tag-version --allow-same-version)
        node -e "const fs=require('fs');const p='backend/pyproject.toml';let s=fs.readFileSync(p,'utf8');s=s.replace(/^version = \".*\"$/m,'version = \"'+process.env.VERSION+'\"');fs.writeFileSync(p,s)"
      preflight-command: cd desktop && npx tsc --noEmit
      build-command: cd desktop && npx electron-vite build
      sidecar-command: bash scripts/build-sidecar.sh
      # Windows builds are intentionally unsigned until Azure Trusted Signing
      # is configured; macOS is signed and notarized on both architectures.
      # One macOS leg per architecture: the sidecar (PyInstaller + pandoc/typst)
      # is host-arch specific, so x64 and arm64 cannot share one build.
      package-command: |
        cd desktop
        if [ "$PLATFORM" = "mac" ]; then
          if [ "$TARGET_OS" = "macos-15-intel" ]; then ARCH_FLAG=--x64; else ARCH_FLAG=--arm64; fi
          npx electron-builder --mac "$ARCH_FLAG" --publish always
        else
          npx electron-builder --$PLATFORM --publish always
        fi
      notarize-check-command: cd desktop && npx electron-builder --mac --arm64 --publish never
      notarize-check-artifact-root: desktop/dist
      signing-mode: custom
      notarize-mode: hook
      publish-mode: builder
      matrix: |
        [
          {"os":"macos-15","platform":"mac"},
          {"os":"macos-15-intel","platform":"mac"},
          {"os":"ubuntu-latest","platform":"linux"},
          {"os":"windows-latest","platform":"win"}
        ]
      artifact-globs: |
        desktop/dist/*.dmg
        desktop/dist/*.exe
        desktop/dist/*.AppImage
        desktop/dist/*.yml
        desktop/dist/*.yaml
        desktop/dist/*.blockmap
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

  merge-mac-manifest:
    # electron-builder writes latest-mac.yml per arch; merge both so updater
    # clients on arm64 and x64 both see a valid file.
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge macOS update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p mac-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --dir mac-assets
          VERSION="$version" python3 - <<'PY'
          import base64, datetime, hashlib, os, pathlib

          files = []
          for path in sorted(pathlib.Path("mac-assets").glob("*.dmg")):
              data = path.read_bytes()
              files.append({
                  "url": path.name,
                  "sha512": base64.b64encode(hashlib.sha512(data).digest()).decode(),
                  "size": len(data),
              })
          if not files:
              raise SystemExit("No macOS DMGs found to merge")

          primary = next((f for f in files if "arm64" in f["url"]), files[0])
          released = datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%S.000Z")
          lines = [f"version: {os.environ['VERSION']}", "files:"]
          for item in files:
              lines += [
                  f"  - url: {item['url']}",
                  f"    sha512: {item['sha512']}",
                  f"    size: {item['size']}",
              ]
          lines += [
              f"path: {primary['url']}",
              f"sha512: {primary['sha512']}",
              f"releaseDate: '{released}'",
              "",
          ]
          pathlib.Path("latest-mac.yml").write_text("\n".join(lines))
          PY
          gh release upload "$GITHUB_REF_NAME" latest-mac.yml \
            --clobber --repo "$GITHUB_REPOSITORY"
