name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    env:
      # Pin the interpreter so CI matches local (project requires >=3.13).
      UV_PYTHON: '3.13'
      # Placeholder keys so the provider-detection tests see a configured
      # provider. No real API calls are made — these tests only check that a
      # present key surfaces the provider.
      OPENAI_API_KEY: 'test-key'
      ANTHROPIC_API_KEY: 'test-key'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pandoc is a real runtime dependency (docx import / doc export); the
      # tests that parse .docx need it on PATH.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      # --frozen uses the exact locked versions (incl. ruff) instead of
      # letting `uv run` fetch a newer tool; --extra dev adds pytest, which
      # lives in the optional-dependencies group rather than dependency-groups.
      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen basedpyright

      - name: Tests
        run: uv run --frozen pytest -q -m "not slow"

  frontend:
    name: Frontend (lint, types, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  desktop-build:
    name: Desktop build (types + package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend + desktop dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Type check desktop
        run: npm run type-check --prefix desktop

      - name: Build renderer and main process
        run: npm run build --prefix desktop

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build only (no push): proves the shipped image still builds on PRs.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
