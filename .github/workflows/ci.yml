name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    env:
      # Pin the interpreter so CI matches local (project requires >=3.13).
      UV_PYTHON: '3.13'
      # Placeholder keys so the provider-detection tests see a configured
      # provider. No real API calls are made — these tests only check that a
      # present key surfaces the provider.
      OPENAI_API_KEY: 'test-key'
      ANTHROPIC_API_KEY: 'test-key'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pandoc is a real runtime dependency (docx import / doc export); the
      # tests that parse .docx need it on PATH.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # --frozen uses the exact locked versions (incl. ruff) instead of
      # letting `uv run` fetch a newer tool; --extra dev adds pytest, which
      # lives in the optional-dependencies group rather than dependency-groups.
      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen basedpyright

      - name: Tests
        run: uv run --frozen pytest -q -m "not slow"

  frontend:
    name: Frontend (lint, types, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
